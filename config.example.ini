; Configuración de FlashFood.
; Copia este archivo como config.ini (no se sube al repositorio) y ajústalo a tu equipo,
; o cámbialo desde la pantalla Configuración de la aplicación.
; Sin config.ini, la aplicación trabaja con los JSON de data/.

[persistencia]
; json | mysql
motor = json

[mysql]
; Valores de XAMPP recién instalado: usuario root, sin contraseña, puerto 3306.
host = 127.0.0.1
puerto = 3306
usuario = root
contrasena =
base_datos = flashfood
