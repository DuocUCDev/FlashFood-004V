name: Python tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: flashfood
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pflashfood"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    env:
      FLASHFOOD_TEST_MYSQL_HOST: 127.0.0.1
      FLASHFOOD_TEST_MYSQL_CONTRASENA: flashfood
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - run: python -m pip install -e .
    - run: python -m unittest discover -s tests -v
    - run: flashfood-demo
